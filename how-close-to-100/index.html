<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Close to 100?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
 :root{
  --ink:#f3f4f6; --muted:#a5b0d0; --screen:#0b1030; --panel:#151b45; --line:#9aa3b5;
  --a-fill:#bfe0ff; --a-line:#1f5fa8; --b-fill:#ffcdc9; --b-line:#b3261e;
  --yellow:#f7e64c; --orange:#f59e2b; --red:#e2483d; --green:#3fbf5f; --blue:#3b82f6; --tan:#d9b77a;
  --pixel:"Press Start 2P",ui-monospace,monospace;
 }
 *{box-sizing:border-box;}
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);margin:0;min-height:100vh;
   background:radial-gradient(ellipse at top,#1b2466 0%,var(--screen) 60%);}
 body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);}
 main{max-width:1000px;margin:0 auto;padding:18px 16px 40px;}
 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
 h1{font-family:var(--pixel);font-size:clamp(16px,3.2vw,26px);line-height:1.3;margin:0;color:var(--yellow);text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;}
 .stripes{display:flex;height:6px;margin:10px 0 6px;max-width:420px;}
 .stripes i{flex:1;} .stripes i:nth-child(1){background:var(--red);} .stripes i:nth-child(2){background:var(--orange);} .stripes i:nth-child(3){background:var(--yellow);} .stripes i:nth-child(4){background:var(--green);} .stripes i:nth-child(5){background:var(--blue);}
 .sub{color:var(--muted);font-size:13px;margin:0 0 16px;}
 .sub a{color:inherit;}
 .layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-areas:"ledger board panel";gap:20px;align-items:start;}
 .ledgerCol{grid-area:ledger;} .boardCol{grid-area:board;} .panel{grid-area:panel;}
 @media (max-width:1100px){ .layout{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"board panel" "ledger panel";} }
 @media (max-width:780px){ .layout{grid-template-columns:1fr;grid-template-areas:"board" "panel" "ledger";} }
 /* the running total */
 .ledger{font-size:17px;font-variant-numeric:tabular-nums;}
 .ledger .row{border-left:5px solid;padding:4px 0 6px 8px;margin:0 0 8px;}
 .ledger .row.A{border-color:#5ea6ff;} .ledger .row.B{border-color:#ff7d73;}
 .ledger .line{display:flex;align-items:center;gap:6px;min-height:34px;}
 .ledger .line .eq{white-space:nowrap;}
 .ledger input{width:3.4em;font:inherit;font-weight:700;padding:3px 6px;border:2px solid var(--yellow);border-radius:4px;background:#0b1030;color:#fff;text-align:center;}
 .ledger input.bad{border-color:var(--red);animation:shake .4s;}
 .ledger .ok{font-family:var(--pixel);font-size:10px;padding:8px 9px;background:var(--yellow);color:#111;box-shadow:2px 2px 0 #000;}
 .ledger .ans{font-weight:800;color:#fff;}
 .ledger .tot{color:var(--yellow);font-weight:800;}
 .ledger .hint{font-size:13px;color:var(--yellow);min-height:1.2em;}
 .ledger .empty{color:var(--muted);font-size:14px;}
 .setup .nm{display:flex;flex-direction:column;gap:4px;font-family:var(--pixel);font-size:9px;margin:8px 0;}
 .setup .nm.A{color:#8fc3ff;} .setup .nm.B{color:#ff9b93;}
 .setup .nm input{font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:7px 9px;border-radius:5px;border:2px solid currentColor;background:#0b1030;color:#fff;}
 .setup .switch{margin-top:10px;padding-top:10px;border-top:1px solid #2a3170;}

 /* the board */
 .board{position:relative;width:100%;max-width:560px;aspect-ratio:1;border:8px solid var(--tan);outline:3px solid #000;border-radius:4px;touch-action:none;user-select:none;-webkit-user-select:none;background:#fbf8ec;
   background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:10% 10%;box-shadow:0 0 0 6px #000,0 12px 30px rgba(0,0,0,.5);}
 .board.waiting{cursor:crosshair;}
 .rect{white-space:nowrap;overflow:hidden;position:absolute;border:3px solid;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--pixel);font-size:clamp(8px,1.6vw,12px);}
 .rect.A{background:var(--a-fill);border-color:var(--a-line);color:var(--a-line);}
 .rect.B{background:var(--b-fill);border-color:var(--b-line);color:var(--b-line);}
 .rect.preview{opacity:.8;border-style:dashed;}
 .rect.pop{animation:pop .25s ease-out;}
 @keyframes pop{0%{transform:scale(.85);}70%{transform:scale(1.04);}100%{transform:scale(1);}}

 .board.shake{animation:shake .5s;}
 @keyframes shake{0%,100%{transform:translateX(0);}15%{transform:translateX(-10px);}30%{transform:translateX(9px);}45%{transform:translateX(-7px);}60%{transform:translateX(5px);}75%{transform:translateX(-3px);}}
 .noroom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(226,72,61,.28);pointer-events:none;z-index:5;
   font-family:var(--pixel);font-size:clamp(22px,5vw,40px);color:#fff;text-shadow:3px 3px 0 var(--red),6px 6px 0 #000;animation:flash 1.4s ease-out forwards;}
 @keyframes flash{0%{opacity:0;transform:scale(.6);}15%{opacity:1;transform:scale(1.15);}30%{transform:scale(1);}80%{opacity:1;}100%{opacity:0;}}
 .pass{background:var(--orange);color:#111;box-shadow:0 5px 0 #a8641b,0 5px 0 3px #000;width:100%;margin-top:10px;}
 .pass:active{transform:translateY(4px);box-shadow:0 1px 0 #a8641b,0 1px 0 3px #000;}
 .msg.stop{font-size:15px;font-weight:700;color:#fff;background:#3a1220;border:2px solid var(--red);border-radius:6px;padding:8px 10px;}
 /* side panel */
 .panel{display:flex;flex-direction:column;gap:14px;}
 .card{background:var(--panel);border:3px solid #000;border-radius:6px;padding:12px 14px;position:relative;box-shadow:4px 4px 0 #000;}
 .card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--red) 0 20%,var(--orange) 20% 40%,var(--yellow) 40% 60%,var(--green) 60% 80%,var(--blue) 80%);}
 .card h2{font-family:var(--pixel);font-size:10px;margin:6px 0 10px;color:var(--yellow);letter-spacing:.05em;}
 .turn{font-family:var(--pixel);font-size:13px;line-height:1.5;margin-top:4px;padding:8px 10px;border-radius:4px;background:#0b1030;}
 .turn.A{background:var(--a-line);} .turn.B{background:var(--b-line);}
 /* the Pop-O-Matic: two dice under a clear dome */
 .popper{position:relative;width:220px;margin:16px auto 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
 .popper.busy{cursor:default;}
 .dome{position:relative;height:132px;border-radius:50% 50% 8px 8px / 80% 80% 8px 8px;border:3px solid rgba(255,255,255,.75);
   background:radial-gradient(ellipse at 30% 22%,rgba(255,255,255,.55) 0 12%,rgba(255,255,255,.08) 30%,rgba(160,200,255,.12) 70%);
   box-shadow:inset 0 -10px 18px rgba(255,255,255,.12),0 0 0 3px #000;transform-origin:50% 100%;}
 .dome .dice{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:18px;}
 .dice svg{width:62px;height:62px;filter:drop-shadow(3px 3px 0 #000);}
 .base{height:30px;margin:0 -10px;border-radius:6px 6px 14px 14px;border:3px solid #000;background:linear-gradient(#f7e64c,#d4be1e);box-shadow:0 6px 0 #000;}
 .burst{position:absolute;left:50%;top:-18px;transform:translate(-50%,0) scale(0);font-family:var(--pixel);font-size:22px;color:var(--yellow);text-shadow:3px 3px 0 var(--red),5px 5px 0 #000;pointer-events:none;opacity:0;}
 .popper.pop .dome{animation:squash .35s ease-out;}
 .popper.pop .burst{animation:burst .7s ease-out;}
 .popper.spin .dice svg:nth-child(1){animation:hop1 .5s ease-in-out infinite;}
 .popper.spin .dice svg:nth-child(2){animation:hop2 .44s ease-in-out infinite;}
 @keyframes squash{0%{transform:scaleY(1);}30%{transform:scaleY(.8) scaleX(1.05);}65%{transform:scaleY(1.08);}100%{transform:scaleY(1);}}
 @keyframes burst{0%{opacity:0;transform:translate(-50%,10px) scale(.3);}25%{opacity:1;transform:translate(-50%,-14px) scale(1.25);}100%{opacity:0;transform:translate(-50%,-40px) scale(1);}}
 @keyframes hop1{0%{transform:translate(0,0) rotate(0);}50%{transform:translate(-12px,-58px) rotate(200deg);}100%{transform:translate(0,0) rotate(360deg);}}
 @keyframes hop2{0%{transform:translate(0,0) rotate(0);}50%{transform:translate(14px,-46px) rotate(-220deg);}100%{transform:translate(0,0) rotate(-360deg);}}
 @media (prefers-reduced-motion:reduce){ .popper.pop .dome,.popper.spin .dice svg{animation:none;} }
 button{font-family:var(--pixel);font-size:12px;border-radius:6px;border:3px solid #000;cursor:pointer;padding:12px 16px;}
 .go{background:var(--yellow);color:#111;box-shadow:0 5px 0 #a8911b,0 5px 0 3px #000;width:100%;}
 .go:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a8911b,0 1px 0 3px #000;}
 button:disabled{opacity:.35;cursor:default;}
 .ghost{background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 #000;}
 .sound{font-size:10px;padding:9px 12px;}
 .switches{display:flex;gap:10px;flex-wrap:wrap;}
 #vs.cpu{background:var(--b-line);color:#fff;}
 .sound.on{background:var(--green);color:#06260f;}
 .msg{min-height:2.6em;font-size:14px;margin-top:12px;color:var(--ink);}
 .msg.warn{color:var(--yellow);}
 .filled{font-family:var(--pixel);font-size:26px;color:#fff;}
 .filled small{font-size:10px;color:var(--muted);}
 .meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:10px;}
 .meter i{height:10px;background:#0b1030;border:1px solid #000;}
 .meter i.on{background:var(--green);}
 .setup label{display:block;margin:6px 0;font-size:15px;}
 .over{font-family:var(--pixel);font-size:12px;line-height:1.6;color:var(--yellow);}
</style>
</head>
<body>
<main>
 <div class="top">
  <h1>How Close<br>to 100?</h1>
  <div class="switches">
   <button class="ghost sound" id="vs" aria-label="Play with: switch between a partner and the computer">PLAY WITH: PARTNER</button>
   <button class="ghost sound" id="sound" aria-pressed="false">♪ SOUND: OFF</button>
  </div>
 </div>
 <div class="stripes"><i></i><i></i><i></i><i></i><i></i></div>
 <div class="sub">The game from <a href="https://www.youcubed.org/tasks/how-close-to-100/">YouCubed</a> (Stanford). Roll two dice, draw an array that size, and fill the grid together.</div>

 <div class="layout">
  <div class="ledgerCol">
   <div class="card">
    <h2>Running total</h2>
    <div class="ledger" id="ledger"><div class="empty">Each array goes here.</div></div>
   </div>
  </div>

  <div class="boardCol">
   <div class="board" id="board" aria-label="A 10 by 10 grid"></div>
  </div>

  <div class="panel">
   <div class="card setup" id="setup">
    <h2>Setup</h2>
    <label class="nm A">Blue player <input id="inA" maxlength="16" placeholder="Player A" autocomplete="off"></label>
    <label class="nm B" id="nmB">Red player <input id="inB" maxlength="16" placeholder="Player B" autocomplete="off"></label>
    <label class="switch"><input type="checkbox" id="kidsMath" checked> Kids do the math: type each product and each new total</label>
    <div style="margin-top:12px"><button class="go" id="start">START</button></div>
   </div>

   <div class="card" id="play">
    <div class="turn" id="turn"></div>
    <div class="popper" id="popper" role="button" tabindex="0" aria-label="Pop the dice">
     <div class="burst">POP!</div>
     <div class="dome"><div class="dice" id="dice"></div></div>
     <div class="base"></div>
    </div>
    <button class="go" id="roll">POP!</button>
    <button class="pass" id="pass" hidden>PASS</button>
    <div class="msg" id="msg"></div>
   </div>

   <div class="card">
    <h2>Filled</h2>
    <div class="filled" id="filled">0 <small>of 100</small></div>
    <div class="meter" id="meter"></div>
   </div>

   <div><button class="ghost" id="again" hidden>NEW GAME</button></div>
  </div>
 </div>
</main>

<script>
(function(){
  const N = 10;
  const board = document.getElementById("board");
  const $ = id => document.getElementById(id);
  let S, idleFaces=[5,2];

  function fresh(mode){
    return { mode, started:false, grid: Array.from({length:N},()=>Array(N).fill(null)), placed:[], turn:"A",
             dice:null, rolling:false, passes:0, over:false, kidsMath:true, total:0, entries:[], pending:null, names:{A:"",B:""} };
  }
  const nameOf = p => p==="A" ? (S.names.A||"Player A") : (S.mode==="computer" ? "Computer" : (S.names.B||"Player B"));
  const isComputer = p => S.mode==="computer" && p==="B";

  // ---------- 8-bit sound: square-wave melody, triangle bass, noise for the dice ----------
  // "Pop Goes the Weasel" (England, 1850s) -- public domain; this 8-bit arrangement is made here, in code.
  // Times are in eighth notes (6/8 time, six to a bar). A pop sound lands on the word "POP!" in bar 7.
  const SND = (function(){
    let ctx=null, master=null, on=false, timer=null, next=0, step=0;
    const f = m => 440*Math.pow(2,(m-69)/12);
    const B1=[[72,2],[72,1],[74,2],[74,1]], B2=[[76,1],[79,1],[76,1],[72,3]];
    const MEL=[].concat(B1,B2, B1,[[76,3],[72,3]], B1,B2, [[81,3],[74,2],[77,1]],[[76,3],[72,3]]);
    const BASS=[[48,55],[48,55],[43,50],[48,55],[48,55],[48,55],[41,48],[43,48]];   // two dotted quarters per bar
    const BEAT=0.2;   // one eighth note
    const seq=[]; let t=0; MEL.forEach(([m,d])=>{ seq.push({t,m,d,v:"mel"}); t+=d; });
    BASS.forEach((pair,i)=>{ seq.push({t:i*6,m:pair[0],d:3,v:"bass"}); seq.push({t:i*6+3,m:pair[1],d:3,v:"bass"}); });
    seq.push({t:36,v:"pop"});
    seq.sort((x,y)=>x.t-y.t);
    const LOOP=t;
    function ensure(){ if(ctx) return true; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination); return true; }catch(e){ return false; } }
    function tone(freq,start,dur,type,vol){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+0.01);
      g.gain.setValueAtTime(vol,start+Math.max(0.02,dur-0.04)); g.gain.linearRampToValueAtTime(0,start+dur);
      o.connect(g); g.connect(master); o.start(start); o.stop(start+dur+0.02);
    }
    function noise(start,dur,vol){
      const len=Math.floor(ctx.sampleRate*dur), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      const src=ctx.createBufferSource(), g=ctx.createGain(); src.buffer=buf; g.gain.value=vol;
      src.connect(g); g.connect(master); src.start(start);
    }
    function popAt(t){
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(110,t+0.13);
      g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16);
    }
    function tick(){
      const ahead=ctx.currentTime+0.2;
      while(next<ahead){
        const loopStart=next - (seq[step].t*BEAT);
        const e=seq[step];
        if(e.v==="pop") popAt(next);
        else tone(f(e.m), next, e.d*BEAT*0.92, e.v==="mel"?"square":"triangle", e.v==="mel"?0.07:0.12);
        step++;
        if(step>=seq.length){ step=0; next=loopStart+LOOP*BEAT+seq[0].t*BEAT; }
        else next=loopStart+seq[step].t*BEAT;
      }
    }
    function start(){ if(!ensure()) return; if(ctx.state==="suspended") ctx.resume(); step=0; next=ctx.currentTime+0.1; clearInterval(timer); timer=setInterval(tick,50); }
    function stop(){ clearInterval(timer); timer=null; if(master){ master.gain.cancelScheduledValues(ctx.currentTime); const old=master; master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination); old.disconnect(); } }
    return {
      get on(){ return on; },
      set(v){ on=v; if(on) start(); else stop(); },
      roll(){ if(on&&ctx){ const t=ctx.currentTime;
        popAt(t);
        for(let k=0;k<14;k++) noise(t+0.12+k*0.135+Math.random()*0.04,0.045,0.12); } },
      place(){ if(on&&ctx){ const t=ctx.currentTime; tone(f(72),t,0.07,"square",0.1); tone(f(79),t+0.07,0.1,"square",0.1); } },
      wrong(){ if(on&&ctx){ tone(f(43),ctx.currentTime,0.22,"square",0.1); } },
      noRoom(){ if(on&&ctx){ const t=ctx.currentTime;   // a game-show "over the limit" buzzer: two low, detuned sawtooth tones
        [[98,0.2],[104,0.2],[49,0.14]].forEach(([hz,v])=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sawtooth"; o.frequency.value=hz;
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02); g.gain.setValueAtTime(v,t+0.85); g.gain.linearRampToValueAtTime(0,t+0.95);
          o.connect(g); g.connect(master); o.start(t); o.stop(t+1); }); } },
      speak(text){ if(!on||!("speechSynthesis" in window)) return;
        try{ window.speechSynthesis.cancel(); const u=new window.SpeechSynthesisUtterance(text); u.pitch=0.1; u.rate=0.8; u.volume=1;
          const v=window.speechSynthesis.getVoices().find(x=>/^en(-|_)US/i.test(x.lang))||window.speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang)); if(v) u.voice=v;
          window.speechSynthesis.speak(u); }catch(e){} },
      over(){ if(on&&ctx){ const t=ctx.currentTime; [72,76,79,84].forEach((m,i)=>tone(f(m),t+i*0.12,0.14,"square",0.1)); } }
    };
  })();
  function setSound(v){
    SND.set(v); if(!v){ try{ window.speechSynthesis.cancel(); }catch(e){} } const b=$("sound"); b.textContent="♪ SOUND: "+(v?"ON":"OFF"); b.classList.toggle("on",v); b.setAttribute("aria-pressed",String(v));
    try{ localStorage.setItem("hc100-sound", v?"on":"off"); }catch(e){}
  }
  $("sound").onclick=()=>setSound(!SND.on);

  // ---------- dice ----------
  const PIPS = {1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],
                5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]};
  function dieSVG(n, edge, dim){
    const dots = PIPS[n].map(([r,c])=>`<circle cx="${c*14+2}" cy="${r*14+2}" r="4.6" fill="#111827"/>`).join("");
    return `<svg viewBox="0 0 60 60" role="img" aria-label="${n}" style="opacity:${dim?0.4:1}"><rect x="3" y="3" width="54" height="54" rx="9" fill="#fff" stroke="${edge}" stroke-width="5"/>${dots}</svg>`;
  }
  const edgeOf = p => p==="A" ? "#1f5fa8" : "#b3261e";
  function showDice(faces, live){
    $("dice").innerHTML = dieSVG(faces[0], live?edgeOf(S.turn):"#6b7280", !live) + dieSVG(faces[1], live?edgeOf(S.turn):"#6b7280", !live);
  }

  // ---------- board ----------
  function free(r,c,h,w){
    if(r<0||c<0||r+h>N||c+w>N) return false;
    for(let i=r;i<r+h;i++) for(let j=c;j<c+w;j++) if(S.grid[i][j]) return false;
    return true;
  }
  function firstFit(h,w){
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(free(r,c,h,w)) return {r,c,h,w};
    return null;
  }
  const anyFit = (a,b) => firstFit(a,b) || firstFit(b,a);
  const filled = () => S.grid.flat().filter(Boolean).length;

  function rectEl(cls,r,c,h,w,label){
    const d=document.createElement("div");
    d.className="rect "+cls;
    d.style.left=(c*10)+"%"; d.style.top=(r*10)+"%"; d.style.width=(w*10)+"%"; d.style.height=(h*10)+"%";
    d.textContent=label||"";
    return d;
  }
  function drawBoard(popLast){
    board.querySelectorAll(".rect").forEach(e=>e.remove());
    S.placed.forEach((p,i)=>board.appendChild(rectEl(p.who+(popLast&&i===S.placed.length-1?" pop":""),p.r,p.c,p.h,p.w,(p.w>1&&p.h>1)||p.w>=3?p.h+" × "+p.w:"")));
  }
  function place(who,r,c,h,w){
    for(let i=r;i<r+h;i++) for(let j=c;j<c+w;j++) S.grid[i][j]=who;
    S.placed.push({who,r,c,h,w});
    const e={who,h,w,p:h*w,prev:S.total,step:"p"};
    e.total=e.prev+e.p;
    S.entries.push(e);
    S.passes=0; idleFaces=S.dice; S.dice=null;
    SND.place();
    drawBoard(true);
    if(S.kidsMath){ S.pending=e; renderSide(); renderLedger(true); return; }   // the turn waits for the kids' arithmetic
    e.step="done"; S.total=e.total; renderSide(); renderLedger();
    nextTurn();
  }

  // ---------- the running total ----------
  // With "kids do the math" on, the app never shows a product or a total until a child has typed it.
  function renderLedger(focus){
    const L=$("ledger");
    if(!S.entries.length){ L.innerHTML='<div class="empty">Each array goes here.</div>'; return; }
    L.innerHTML=S.entries.map((e,i)=>{
      const live=e===S.pending;
      const box=(id)=>`<input id="${id}" inputmode="numeric" autocomplete="off" aria-label="answer"> <button class="ok" data-ok="${id}">OK</button>`;
      let l1=`<div class="line"><span class="eq">${e.h} × ${e.w} =</span> `+(live&&e.step==="p"?box("ansP"):`<span class="ans">${e.p}</span>`)+`</div>`;
      let l2="";
      if(i===0){ if(!(live&&e.step==="p")) l2=`<div class="line"><span class="eq">total</span> <span class="tot">${e.total}</span></div>`; }
      else if(!(live&&e.step==="p")) l2=`<div class="line"><span class="eq">${e.prev} + ${e.p} =</span> `+(live&&e.step==="t"?box("ansT"):`<span class="tot">${e.total}</span>`)+`</div>`;
      const hint=live?`<div class="hint" id="hint"></div>`:"";
      return `<div class="row ${e.who}">${l1}${l2}${hint}</div>`;
    }).join("");
    L.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>check(b.dataset.ok));
    L.querySelectorAll("input").forEach(inp=>inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter") check(inp.id); }));
    const inp=L.querySelector("input"); if(inp&&focus!==false) inp.focus();
    L.scrollTop=L.scrollHeight;
  }
  function check(id){
    const e=S.pending, inp=$(id); if(!e||!inp) return;
    const v=parseInt(inp.value.trim(),10);
    const want = id==="ansP" ? e.p : e.total;
    if(v!==want){
      SND.wrong(); inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");
      $("hint").textContent="Not quite. Try again."; inp.select(); return;
    }
    SND.place();
    if(id==="ansP" && e.prev>0){ e.step="t"; renderLedger(); return; }
    e.step="done"; S.total=e.total; S.pending=null;
    renderLedger(false); renderSide(); nextTurn();
  }

  // ---------- turns ----------
  function say(t,warn){ const m=$("msg"); m.textContent=t||""; m.className="msg"+(warn===2?" stop":warn?" warn":""); }
  function renderSide(){
    const t=$("turn");
    if(!S.started){ t.className="turn"; t.textContent="Press START"; }
    else if(!S.over){ t.className="turn "+S.turn; t.textContent=nameOf(S.turn)+"'s turn"; }
    if(!S.rolling) showDice(S.dice||idleFaces, !!S.dice);
    $("roll").disabled = !S.started || S.over || !!S.dice || S.rolling || !!S.noRoom || !!S.pending || isComputer(S.turn);
    $("roll").hidden = S.over || !!S.noRoom;
    $("pass").hidden = !S.noRoom;
    const n=S.total;
    $("filled").innerHTML = n+" <small>of 100</small>";
    $("meter").innerHTML = Array.from({length:10},(_,i)=>`<i class="${n>=(i+1)*10?"on":""}"></i>`).join("");
    board.classList.toggle("waiting", !!S.dice && !isComputer(S.turn) && !S.over);
  }
  function nextTurn(){
    S.turn = S.turn==="A" ? "B" : "A";
    renderSide();
    if(isComputer(S.turn)) setTimeout(roll, 700);
  }
  function endGame(){
    S.over=true; if(S.dice) idleFaces=S.dice; S.dice=null; renderSide();
    say(""); const t=$("turn"); t.className="turn"; t.innerHTML=`<div class="over">GAME OVER<br>${S.total} of 100 full</div>`;
    SND.over();
    $("again").hidden=false;
  }
  function roll(){
    if(S.over||S.dice||S.rolling) return;
    const a=1+Math.floor(Math.random()*6), b=1+Math.floor(Math.random()*6);
    S.rolling=true; renderSide(); SND.roll(); SND.speak("Pop!");
    const pop=$("popper"); pop.classList.remove("pop","spin"); void pop.offsetWidth; pop.classList.add("pop","spin","busy");
    const spin=setInterval(()=>showDice([1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)], true), 90);
    setTimeout(()=>{ clearInterval(spin); pop.classList.remove("spin","pop","busy"); landed(a,b); }, 2000);
  }
  const WORD=["","One","Two","Three","Four","Five","Six"];
  function landed(a,b){
    S.rolling=false; S.dice=[a,b]; renderSide();
    SND.speak(`${WORD[a]} by ${WORD[b].toLowerCase()} rectangle.`);
    if(!anyFit(a,b)){
      // Stop here on purpose: why a roll has no room is worth talking about, so the game waits for PASS.
      S.noRoom=true; SND.noRoom();
      board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake");
      const flash=document.createElement("div"); flash.className="noroom"; flash.textContent="NO ROOM!"; board.appendChild(flash);
      setTimeout(()=>flash.remove(), 1500);
      say(`No room for a ${a} × ${b}. Why not? Talk it over, then press PASS.`, 2);
      renderSide();
      return;
    }
    if(isComputer(S.turn)){
      say("");
      setTimeout(()=>{ const f=firstFit(a,b)||firstFit(b,a); place("B",f.r,f.c,f.h,f.w); }, 900);
    } else {
      say("Drag on the grid to draw your array.");
    }
  }

  // ---------- drawing ----------
  let drag=null, preview=null;
  function cellAt(e){
    const b=board.getBoundingClientRect();
    const c=Math.min(N-1,Math.max(0,Math.floor((e.clientX-b.left)/b.width*N)));
    const r=Math.min(N-1,Math.max(0,Math.floor((e.clientY-b.top)/b.height*N)));
    return {r,c};
  }
  function span(a,z){ return {r:Math.min(a.r,z.r), c:Math.min(a.c,z.c), h:Math.abs(a.r-z.r)+1, w:Math.abs(a.c-z.c)+1}; }
  board.addEventListener("pointerdown", e=>{
    if(!S||S.over||!S.dice||S.pending||isComputer(S.turn)) return;
    try{ board.setPointerCapture(e.pointerId); }catch(err){}
    drag={start:cellAt(e)}; move(e);
  });
  function move(e){
    if(!drag) return;
    const s=span(drag.start,cellAt(e));
    if(preview) preview.remove();
    preview=rectEl(S.turn+" preview",s.r,s.c,s.h,s.w,s.h+" × "+s.w);
    board.appendChild(preview);
    drag.s=s;
  }
  board.addEventListener("pointermove", move);
  board.addEventListener("pointerup", ()=>{
    if(!drag) return;
    const s=drag.s; drag=null;
    if(preview){ preview.remove(); preview=null; }
    const [a,b]=S.dice;
    const right=(s.h===a&&s.w===b)||(s.h===b&&s.w===a);
    if(!right){ SND.wrong(); say(`You drew ${s.h} × ${s.w}. The dice say ${a} and ${b}.`, true); return; }
    if(!free(s.r,s.c,s.h,s.w)){ SND.wrong(); say("That overlaps an array that's already there.", true); return; }
    say(""); place(S.turn,s.r,s.c,s.h,s.w);
  });
  board.addEventListener("pointercancel", ()=>{ drag=null; if(preview){preview.remove();preview=null;} });

  // ---------- PLAY WITH: one click flips partner <-> computer, and works mid-game for Player B ----------
  let vsMode="human";
  function setVs(m){
    vsMode=m; $("nmB").hidden=(m==="computer"); const b=$("vs"); b.textContent="PLAY WITH: "+(m==="computer"?"COMPUTER":"PARTNER"); b.classList.toggle("cpu",m==="computer");
    if(S){ S.mode=m; renderSide();
      if(S.started&&!S.over&&S.turn==="B"&&m==="computer"&&!S.dice&&!S.rolling&&!S.pending&&!S.noRoom) setTimeout(roll,500); }
  }
  $("vs").onclick=()=>setVs(vsMode==="computer"?"human":"computer");

  // ---------- start ----------
  function start(){
    S=fresh(vsMode); S.started=true;
    S.names={A:$("inA").value.trim().slice(0,16), B:$("inB").value.trim().slice(0,16)}; S.kidsMath=$("kidsMath").checked;
    try{ localStorage.setItem("hc100-kidsmath", S.kidsMath?"on":"off"); }catch(e){}
    $("setup").hidden=true; $("again").hidden=true;
    say(""); drawBoard(); renderSide(); renderLedger();
  }
  $("start").onclick=start;
  $("roll").onclick=roll;
  $("pass").onclick=()=>{
    if(!S.noRoom) return;
    S.noRoom=false; S.passes++; idleFaces=S.dice; S.dice=null; say("");
    if(S.passes>=2){ endGame(); return; }
    nextTurn();
  };
  const popIt=()=>{ if(!$("roll").disabled) roll(); };
  $("popper").addEventListener("click", popIt);
  $("popper").addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); popIt(); } });
  $("again").onclick=()=>{ $("setup").hidden=false; $("again").hidden=true; S=fresh(vsMode); say(""); drawBoard(); renderSide(); renderLedger(); };
  S=fresh("human"); renderSide();
  try{ if(localStorage.getItem("hc100-kidsmath")==="off") $("kidsMath").checked=false; }catch(e){}
  try{ if(localStorage.getItem("hc100-sound")==="on"){ const once=()=>{ setSound(true); removeEventListener("pointerdown",once); }; addEventListener("pointerdown",once); } }catch(e){}
})();
</script>
</body>
</html>
