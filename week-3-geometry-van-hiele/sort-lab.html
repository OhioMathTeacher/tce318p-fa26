<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Lab — sort them, and tell us your rule</title>
<style>
  :root{
    --ground:#161616; --tray:#101010; --line:#2c2c2c;
    --ink:#e8e6e1; --muted:#b9b5ad; --dim:#8d8981;
    --teal:#0f6b52; --indigo:#443f9e; --rust:#8c3319;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);overflow:hidden;
       display:flex;flex-direction:column;
       font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,
                   "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         padding:10px 16px;border-bottom:1px solid var(--line);}
  .ttl{font-size:19px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .prompt em{color:var(--dim)}
  .spacer{flex:1 1 auto}

  .sets{display:inline-flex;border:1px solid #3a3a3a;border-radius:10px;overflow:hidden}
  .sets button{border:0;border-right:1px solid #3a3a3a;background:#1e1e1e;color:var(--muted);
        font:inherit;font-size:14px;font-weight:600;padding:8px 13px;cursor:pointer}
  .sets button:last-child{border-right:0}
  .sets button.on{background:var(--ink);color:#161616}

  .btn{border:1px solid #3a3a3a;background:#1e1e1e;color:var(--ink);border-radius:10px;
       font:inherit;font-size:14px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#6a6a6a}
  .btn.go{background:var(--ink);color:#161616;border-color:var(--ink)}
  .tools{display:inline-flex;gap:5px}
  .btn.ic{padding:6px 10px;font-size:17px;line-height:1}
  .dot{cursor:grab}
  .dot:active{cursor:grabbing}

  #stage{flex:1 1 auto;display:block;width:100%;touch-action:none;user-select:none}
  #stage text{user-select:none}
  .obj{cursor:grab}
  .hint{fill:#5a5650;font-size:13px}

  #info{position:fixed;display:none;z-index:8;max-width:290px;pointer-events:none;
     background:#1e1e1e;border:1px solid #4a4a4a;border-radius:11px;padding:11px 14px;
     box-shadow:0 8px 26px rgba(0,0,0,.5)}
  #info .ch{font-size:30px;font-weight:800;line-height:1;float:left;margin:0 12px 2px 0}
  #info .pin{font-size:14px;color:var(--dim);font-style:italic}
  #info .gl{font-size:16px;font-weight:700;margin-top:1px}
  #info .no{font-size:13px;color:var(--muted);margin-top:7px;clear:both;line-height:1.4}
  #labelEdit{position:fixed;display:none;z-index:9;font:inherit;font-size:17px;font-weight:600;
     text-align:center;padding:8px 12px;border-radius:9px;border:1px solid #6a6a6a;
     background:#1e1e1e;color:var(--ink);}
</style>
</head>
<body>

<header>
  <span class="ttl" id="ttl">Sort Lab</span>
  <span class="spacer"></span>
  <span class="sets" id="sets"></span>
  <span class="tools" id="tools">
    <button class="btn ic" id="turnL" title="Turn the marked piece left 15°">⟲</button>
    <button class="btn ic" id="turnR" title="Turn the marked piece right 15°">⟳</button>
    <button class="btn ic" id="flipH" title="Flip the marked piece left–right">⇄</button>
    <button class="btn ic" id="flipV" title="Flip the marked piece up–down">⇅</button>
  </span>
  <button class="btn" id="addOval">+ Group</button>
  <button class="btn go" id="again">Sort a different way</button>
  <span class="sets" id="langs"></span>
</header>

<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" aria-label="Sorting board"></svg>

<input id="labelEdit" type="text" autocomplete="off" spellcheck="false">
<div id="info"></div>

/* ------------------------------------------------------------------ *
 * Sort Lab — the third Week 3 geometry talk.
 * WODB and Same & Different have public libraries; sorting does not.
 * Firefox-safe: every SVG node is built with createElementNS. There is
 * no innerHTML on an SVG node anywhere in this file.
 * Nothing is saved, scored, or checked. Every defensible rule is right.
 * ------------------------------------------------------------------ */

var NS = "http://www.w3.org/2000/svg";
function el(tag, attrs){
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);

}

  rulePH:     ["your rule for this group", "tu regla para este grupo", "这一组的规则"]
};
function t(k){ return T[k][LANGI]; }
/* labels are either a plain string or an [en, es, zh] triple */
function lbl(v){ return (v && v.join) ? v[LANGI] : v; }

var TEAL = "#0f6b52", INDIGO = "#443f9e", RUST = "#8c3319";

/* ---------- little geometry helpers ---------- */
function P(a){
  var s = [];
  for (var i = 0; i < a.length; i++) s.push(a[i][0].toFixed(1) + "," + a[i][1].toFixed(1));
  return s.join(" ");
}
function reg(n, r, rot){
  var a = [];
  for (var i = 0; i < n; i++){ var t = rot + i * 2 * Math.PI / n; a.push([r*Math.cos(t), r*Math.sin(t)]); }
  return a;
}
function star(r1, r2){
  var a = [];
  for (var i = 0; i < 10; i++){ var r = (i % 2) ? r2 : r1, t = -Math.PI/2 + i*Math.PI/5;
    a.push([r*Math.cos(t), r*Math.sin(t)]); }
  return a;
}
/* part = [tag, attrs, textContent?]  —  fill is injected where marked */
function poly(a){
  var fn = function(fill){ return [["polygon", {points:P(a), fill:fill}]]; };
  fn.verts = a;                       /* where the turn handles go */
  return fn;
}
function prim(tag, attrs){
  var fn = function(fill){
    var o = {}; for (var k in attrs) o[k] = attrs[k];
    o.fill = fill; return [[tag, o]];
  };
  if (tag === "rect"){
    var x = attrs.x, y = attrs.y, w = attrs.width, h = attrs.height;
    fn.verts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  }
  return fn;                          /* circles and ellipses have no corners: one top handle */
}
function fixed(parts){ return function(){ return parts; }; }

/* ---------- the five object sets ---------- */

/* Every triangle arrives tilted, so none of them sits on a flat base.
   A horizontal base is the prototype that lets someone say "triangle" without
   looking at a single property — the exact van Hiele Level 0 read this week is
   trying to get past. Tilts are chosen so no edge comes within 12 degrees of
   horizontal. Candidates can still turn a piece to a base if they want one:
   that becomes a move they made, and can be asked about. */
function rotPts(a, deg){
  var r = deg * Math.PI / 180, c = Math.cos(r), sn = Math.sin(r), out = [];
  for (var i = 0; i < a.length; i++) out.push([a[i][0]*c - a[i][1]*sn, a[i][0]*sn + a[i][1]*c]);
  return out;
}
function tilt(a, deg){
  var v = rotPts(a, deg), i, xs = [], ys = [];
  for (i = 0; i < v.length; i++){ xs.push(v[i][0]); ys.push(v[i][1]); }
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, out = [];
  for (i = 0; i < v.length; i++) out.push([v[i][0] - cx, v[i][1] - cy]);
  return {pts:out, w:x1 - x0, h:y1 - y0};
}

/* ---------- turn the raw tables into uniform object specs ---------- */
/* Spanish shares the Latin alphabet, so A, B, C carry over unchanged.
   Chinese maths does label figures with Latin letters, but for a PK-5 room
   numerals are plainer, so the index becomes 1, 2, 3. */
function idx(i){
  var L = "ABCDEFGHIJKLMNOP".charAt(i);
  return [L, L, String(i + 1)];
}
function fromTable(rows){
  return rows.map(function(r, i){
    return {label:idx(i), w:r[1], h:r[2], draw:r[3], fill:CYCLE[i % 3], showLabel:true, canFlip:true};
  });
}
function fromFoods(rows){
  return rows.map(function(r){
    return {label:r[0], w:r[1], h:r[2], draw:r[3], fill:null, showLabel:true, canFlip:true};
  });
}
function fromLetters(rows, size){
  return rows.map(function(r, i){
    var f = CYCLE[i % 3];
    return {label:r, w:58, h:66, showLabel:false, fill:f, canFlip:true, draw:function(fill){
      return [["text", {class:"glyph", x:0, y:0, dy:".34em", "text-anchor":"middle",
                        "font-size":String(size), "font-weight":"800",
                        "font-family":"Georgia,'Times New Roman','Noto Sans SC','PingFang SC','Microsoft YaHei',serif",
                        fill:fill}, lbl(r)]];
    }};
  });
}
function fromPeople(rows){
  return rows.map(function(r){
    return {label:r[0], dates:r[1], w:190, h:58, showLabel:false, fill:null, canFlip:false, draw:function(){
      return [
        ["rect", {x:-95, y:-29, width:190, height:58, rx:11, fill:"#1e1e1e",
                  stroke:"#4a4a4a", "stroke-width":1.5}],
        ["text", {x:0, y:-4, "text-anchor":"middle", "font-size":"17",
                  "font-weight":"600", fill:"#f2f0eb"}, r[0]],
        ["text", {class:"dates", x:0, y:16, "text-anchor":"middle", "font-size":"13", fill:"#a9a6a0"}, lbl(r[1])]
      ];
    }};
  });
}

var SETS = [
  {key:"triangles", name:"Triangles", scale:1.35, turn:true, items:fromTable(TRIANGLES)},
  {key:"shapes",    name:"Shapes",    scale:1.30, turn:true, items:fromTable(SHAPES)},
  {key:"letters",   name:"Letters",   scale:1.30, turn:true, items:fromLetters(LETTERS, 62)},
  {key:"chars",     name:"Characters",scale:1.30, turn:true, items:fromLetters(CHARS, 52)},
  {key:"foods",     name:"Foods",     scale:1.30, turn:false, items:fromFoods(FOODS)},
  {key:"people",    name:"People",    scale:1.00, turn:false, items:fromPeople(PEOPLE)}
];

/* ---------- stage ---------- */
var stage = document.getElementById("stage");
var chrome = el("g"), ovalLayer = el("g"), objLayer = el("g");
stage.appendChild(chrome); stage.appendChild(ovalLayer); stage.appendChild(objLayer);

var trayRect = el("rect", {fill:"#101010"});
var trayEdge = el("line", {stroke:"#2c2c2c", "stroke-width":1});
var boardPrompt = el("text", {x:18, y:34, "font-size":"18", "font-weight":"600", fill:"#b9b5ad"});
var trayHint = el("text", {class:"hint", x:18});
var emptyHint = el("text", {class:"hint", "text-anchor":"middle", "font-size":"17"});

chrome.appendChild(trayRect); chrome.appendChild(trayEdge);
chrome.appendChild(trayHint); chrome.appendChild(emptyHint); chrome.appendChild(boardPrompt);

var W = 1200, H = 700, trayTop = 520, trayScale = 1, canvasScale = 1.3;
var objs = [], ovals = [], setKey = "triangles";
var LABEL_GAP = 24;

function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function fullH(spec){ return spec.h + (spec.showLabel ? LABEL_GAP : 0); }
/* distance from a piece's own origin down to the bottom of its label */
function botOff(spec){ return spec.h / 2 + (spec.showLabel ? LABEL_GAP : 0); }

/* ---------- build a set ---------- */
function buildSet(key){
  setKey = key;
  while (objLayer.firstChild) objLayer.removeChild(objLayer.firstChild);
  clearOvals();
  objs = [];

  var set = SETS.filter(function(s){ return s.key === key; })[0];
  canvasScale = set.scale;
  set.items.forEach(function(spec){
    var g = el("g", {class:"obj"});

    /* shown only while a piece is being turned */
    var guide = el("circle", {r:0, fill:"none", stroke:"rgba(232,230,225,0.32)",
                              "stroke-width":1.5, "stroke-dasharray":"5 6",
                              display:"none", "pointer-events":"none"});
    /* marks which piece the Turn / Flip buttons will act on */
    var halo = el("rect", {x:-spec.w/2 - 11, y:-spec.h/2 - 11,
                           width:spec.w + 22, height:fullH(spec) + 22, rx:9,
                           fill:"none", stroke:"rgba(232,230,225,0.40)",
                           "stroke-width":1.5, "stroke-dasharray":"4 5",
                           display:"none", "pointer-events":"none"});

    /* everything that turns and flips lives in art; the name label never does */
    var art = el("g");
    art.appendChild(el("rect", {x:-spec.w/2 - 6, y:-spec.h/2 - 6,
                                width:spec.w + 12, height:spec.h + 12,
                                fill:"transparent"}));
    spec.draw(spec.fill).forEach(function(p){
      var e = el(p[0], p[1]);
      if (p[2] != null) e.textContent = p[2];
      art.appendChild(e);
    });

    var o = {g:g, art:art, guide:guide, halo:halo, spec:spec, canTurn:!!set.turn,
             x:0, y:0, rot:0, fx:1, fy:1, inTray:true, home:{x:0, y:0}};

    /* a handle on every corner — or one above the piece when it has no corners.
       Always visible on the board: hover does not exist on a touchscreen. */
    if (set.turn){
      var vs = spec.draw.verts || null;
      if (vs && vs.length > 8) vs = vs.filter(function(_, i){ return i % 2 === 0; });
      var dots = el("g");
      (vs || [[0, -spec.h/2 - 16]]).forEach(function(v){
        var d = el("circle", {class:"dot", cx:v[0], cy:v[1], r:4.1,
                              fill:"#e8e6e1", stroke:"#161616", "stroke-width":1.5});
        d.addEventListener("pointerdown", function(ev){ startRotate(o, ev); });
        dots.appendChild(d);
      });
      art.appendChild(dots);
      o.dots = dots;
    }

    g.appendChild(guide); g.appendChild(halo); g.appendChild(art);

    if (spec.showLabel){
      g.appendChild(el("rect", {x:-spec.w/2, y:spec.h/2 + 4,
                                width:spec.w, height:LABEL_GAP, fill:"transparent"}));
      var t = el("text", {x:0, y:spec.h/2 + 18, "text-anchor":"middle",
                          "font-size":"15", "font-weight":"600", fill:"#e8e6e1"});
      t.textContent = lbl(spec.label);
      g.appendChild(t);
      o.labelNode = t;
    }

    o.dateNode  = art.querySelector(".dates");
    o.glyphNode = art.querySelector(".glyph");
    g.addEventListener("pointerdown", function(ev){ startObjDrag(o, ev); });
    g.addEventListener("pointerenter", function(ev){
      if (ev.pointerType === "mouse" && !infoStuck && !drag) showInfo(o);
    });
    g.addEventListener("pointerleave", function(){ hideInfo(false); });
    objLayer.appendChild(g);
    objs.push(o);
  });

  document.getElementById("tools").style.display = set.turn ? "inline-flex" : "none";
  hideInfo(true);

  var btns = document.getElementById("sets").children;
  for (var i = 0; i < btns.length; i++)
    btns[i].className = (btns[i].getAttribute("data-key") === key) ? "on" : "";

  applyLang();
  layout();
}

/* ---------- layout: tray slots along the bottom ---------- */
function layout(){
  var r = stage.getBoundingClientRect();
  W = Math.max(320, Math.round(r.width));
  H = Math.max(320, Math.round(r.height));
  stage.setAttribute("viewBox", "0 0 " + W + " " + H);

  var maxW = 1, maxH = 1;
  objs.forEach(function(o){ maxW = Math.max(maxW, o.spec.w); maxH = Math.max(maxH, fullH(o.spec)); });

  /* shrink the tray copies until the strip fits in roughly a third of the board */
  var s = 1, cols = 1, rows = 1, sw = 0, sh = 0, trayH = 0, cap = Math.max(160, H * 0.34);
  while (true){
    sw = maxW * s + 18; sh = maxH * s + 12;
    cols = Math.max(1, Math.floor((W - 36) / sw));
    rows = Math.ceil(objs.length / cols);
    trayH = rows * sh + 26;
    if (trayH <= cap || s <= 0.5) break;
    s -= 0.05;
  }
  trayScale = s;
  trayTop = H - trayH;

  trayRect.setAttribute("x", 0); trayRect.setAttribute("y", trayTop);
  trayRect.setAttribute("width", W); trayRect.setAttribute("height", trayH);
  trayEdge.setAttribute("x1", 0); trayEdge.setAttribute("x2", W);
  trayEdge.setAttribute("y1", trayTop); trayEdge.setAttribute("y2", trayTop);
  trayHint.setAttribute("y", trayTop - 10);
  boardPrompt.setAttribute("y", 34);
  emptyHint.setAttribute("x", W / 2);
  emptyHint.setAttribute("y", trayTop / 2);
  showEmptyHint();

  var gridW = cols * sw;
  var x0 = (W - gridW) / 2 + sw / 2;
  var rowBottom = trayTop + 16 + maxH * s;
  objs.forEach(function(o, i){
    o.home = {x:x0 + (i % cols) * sw,
              y:rowBottom + Math.floor(i / cols) * sh - botOff(o.spec) * s};
    if (o.inTray){ o.x = o.home.x; o.y = o.home.y; }
    else { o.x = clamp(o.x, 30, W - 30); o.y = clamp(o.y, 30, trayTop - 30); }
    place(o);
  });

  ovals.forEach(drawOval);
}

function showEmptyHint(){
  emptyHint.textContent = (objs.length && objs[0].canTurn) ? t("hintTurn") : t("hintPlain");
  var bare = ovals.length === 0 && objs.every(function(o){ return o.inTray; });
  emptyHint.setAttribute("display", bare ? "inline" : "none");
}

function place(o){
  var s = o.inTray ? trayScale : canvasScale;
  o.g.setAttribute("transform", "translate(" + o.x.toFixed(1) + "," + o.y.toFixed(1) + ") scale(" + s.toFixed(3) + ")");
  o.art.setAttribute("transform", "rotate(" + o.rot.toFixed(1) + ") scale(" + o.fx + "," + o.fy + ")");
  if (o.dots) o.dots.setAttribute("display", o.inTray ? "none" : "inline");
}

/* a piece in the tray is always in its canonical orientation */
function resetPiece(o){ o.rot = 0; o.fx = 1; o.fy = 1; }

var activeObj = null;
function setActive(o){
  if (activeObj && activeObj !== o) activeObj.halo.setAttribute("display", "none");
  activeObj = o;
  if (o) o.halo.setAttribute("display", o.inTray ? "none" : "inline");
}
function turnActive(deg){
  if (!activeObj || activeObj.inTray || !activeObj.canTurn) return;
  activeObj.rot += deg; place(activeObj);
}
function flipActive(axis){
  var o = activeObj;
  if (!o || o.inTray || !o.canTurn || !o.spec.canFlip) return;
  if (axis === "h") o.fx = -o.fx; else o.fy = -o.fy;
  place(o);
}

/* ---------- ovals ---------- */
function addOval(){
  var n = ovals.length;
  var rx = Math.min(170, W * 0.18), ry = Math.min(125, trayTop * 0.22);
  var ov = {
    cx: clamp(W * 0.22 + (n % 3) * W * 0.27 + (n > 2 ? 40 : 0), rx + 10, W - rx - 10),
    cy: clamp(trayTop * 0.34 + Math.floor(n / 3) * trayTop * 0.34, ry + 38, trayTop - ry - 10),
    rx: rx, ry: ry, label:"Name this group"
  };
  ov.g = el("g");
  ov.body  = el("ellipse", {fill:"rgba(232,230,225,0.10)", stroke:"rgba(232,230,225,0.55)",
                            "stroke-width":2, cursor:"move"});
  ov.text  = el("text", {"text-anchor":"middle", "font-size":"18", "font-weight":"700",
                         fill:"#e8e6e1", cursor:"text"});
  ov.hx  = handle(); ov.hy = handle(); ov.hxy = handle();
  ov.del = el("circle", {r:12, fill:"#2a2a2a", stroke:"#6a6a6a", "stroke-width":1.5, cursor:"pointer"});
  ov.delX = el("text", {"text-anchor":"middle", dy:".33em", "font-size":"15",
                        "font-weight":"700", fill:"#c9c5be", "pointer-events":"none"});
  ov.delX.textContent = "×";

  ov.g.appendChild(ov.body);
  ov.g.appendChild(ov.text);
  ov.g.appendChild(ov.hx); ov.g.appendChild(ov.hy); ov.g.appendChild(ov.hxy);
  ov.g.appendChild(ov.del); ov.g.appendChild(ov.delX);
  ovalLayer.appendChild(ov.g);

  ov.body.addEventListener("pointerdown", function(ev){ startOvalDrag(ov, ev, "move"); });
  ov.hx .addEventListener("pointerdown", function(ev){ startOvalDrag(ov, ev, "x"); });
  ov.hy .addEventListener("pointerdown", function(ev){ startOvalDrag(ov, ev, "y"); });
  ov.hxy.addEventListener("pointerdown", function(ev){ startOvalDrag(ov, ev, "xy"); });
  ov.del.addEventListener("pointerdown", function(ev){ ev.stopPropagation(); });
  ov.del.addEventListener("click", function(){ removeOval(ov); });
  ov.text.addEventListener("pointerdown", function(ev){ ev.stopPropagation(); });
  ov.text.addEventListener("click", function(){ editLabel(ov); });

  ovals.push(ov);
  drawOval(ov);
  showEmptyHint();
}
function handle(){
  return el("rect", {width:16, height:16, rx:3, fill:"#e8e6e1", stroke:"#161616",
                     "stroke-width":1.5, cursor:"pointer"});
}
function drawOval(ov){
  ov.rx = clamp(ov.rx, 55, W / 2 - 20);
  ov.ry = clamp(ov.ry, 45, Math.max(50, (trayTop - 60) / 2));
  ov.cx = clamp(ov.cx, ov.rx + 8, W - ov.rx - 8);
  ov.cy = clamp(ov.cy, ov.ry + 36, trayTop - ov.ry - 8);

  ov.g.setAttribute("transform", "translate(" + ov.cx.toFixed(1) + "," + ov.cy.toFixed(1) + ")");
  ov.body.setAttribute("rx", ov.rx); ov.body.setAttribute("ry", ov.ry);
  ov.text.setAttribute("x", 0); ov.text.setAttribute("y", -ov.ry - 14);
  ov.text.textContent = ov.label;

  var dx = ov.rx * 0.7071, dy = ov.ry * 0.7071;
  ov.hx .setAttribute("x", ov.rx - 8); ov.hx .setAttribute("y", -8);
  ov.hy .setAttribute("x", -8);        ov.hy .setAttribute("y", ov.ry - 8);
  ov.hxy.setAttribute("x", dx - 8);    ov.hxy.setAttribute("y", dy - 8);
  ov.del.setAttribute("cx", dx);       ov.del.setAttribute("cy", -dy);
  ov.delX.setAttribute("x", dx);       ov.delX.setAttribute("y", -dy);
}
function removeOval(ov){
  if (ov.g.parentNode) ov.g.parentNode.removeChild(ov.g);
  ovals = ovals.filter(function(o){ return o !== ov; });
  showEmptyHint();
}
function clearOvals(){
  ovals.forEach(function(ov){ if (ov.g.parentNode) ov.g.parentNode.removeChild(ov.g); });
  ovals = [];
  document.getElementById("labelEdit").style.display = "none";
}

/* ---------- label editing (an HTML input over the board) ---------- */
function editLabel(ov){
  var inp = document.getElementById("labelEdit");
  var r = stage.getBoundingClientRect();
  var done = false;
  inp.value = (ov.label === "Name this group") ? "" : ov.label;
  inp.placeholder = t("rulePH");
  inp.style.width = "280px";
  inp.style.left = (r.left + ov.cx - 140) + "px";
  inp.style.top  = (r.top + ov.cy - ov.ry - 42) + "px";
  inp.style.display = "block";
  inp.focus(); inp.select();

  function commit(){
    if (done) return;
    done = true;
    ov.label = inp.value.trim() || "Name this group";
    drawOval(ov);
    inp.style.display = "none";
    inp.onblur = null; inp.onkeydown = null;
  }
  inp.onkeydown = function(e){
    if (e.key === "Enter"){ e.preventDefault(); commit(); }
    else if (e.key === "Escape"){ done = true; inp.style.display = "none"; inp.onblur = null; }
  };
  inp.onblur = commit;
}

/* ---------- what is this character? (hover with a mouse, tap on a touchscreen) ---------- */
var infoBox = document.getElementById("info"), infoStuck = false;
function showInfo(o){
  var d = CHAR_INFO[lbl(o.spec.label)];
  if (!d) return;
  while (infoBox.firstChild) infoBox.removeChild(infoBox.firstChild);
  function row(cls, txt){
    var e = document.createElement("div"); e.className = cls; e.textContent = txt;
    infoBox.appendChild(e); return e;
  }
  row("ch", lbl(o.spec.label));
  row("pin", d[0]);
  row("gl", d[1]);
  row("no", d[2]);
  var r = stage.getBoundingClientRect();
  infoBox.style.display = "block";
  var bw = infoBox.offsetWidth, bh = infoBox.offsetHeight;
  var left = r.left + o.x - bw / 2;
  left = Math.max(r.left + 8, Math.min(left, r.left + r.width - bw - 8));
  var top = r.top + o.y - 58 - bh;
  if (top < r.top + 8) top = r.top + o.y + 62;
  infoBox.style.left = left + "px";
  infoBox.style.top  = top + "px";
}
function hideInfo(force){
  if (infoStuck && !force) return;
  infoStuck = false;
  infoBox.style.display = "none";
}

/* ---------- dragging ---------- */
var drag = null;
function pt(ev){
  var r = stage.getBoundingClientRect();
  return {x:ev.clientX - r.left, y:ev.clientY - r.top};
}
function startObjDrag(o, ev){
  ev.preventDefault(); ev.stopPropagation();
  var p = pt(ev);
  objLayer.appendChild(o.g);                 /* the piece you touch comes to the front */
  var dx, dy;
  if (o.inTray){                             /* lift it out of the tray at full size */
    o.inTray = false; o.x = p.x; o.y = p.y; dx = 0; dy = 0; place(o); showEmptyHint();
  } else { dx = o.x - p.x; dy = o.y - p.y; }
  setActive(o);
  hideInfo(true);
  drag = {kind:"obj", o:o, dx:dx, dy:dy, id:ev.pointerId, sx:p.x, sy:p.y, moved:false};
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
}
function startRotate(o, ev){
  ev.preventDefault(); ev.stopPropagation();
  objLayer.appendChild(o.g);
  setActive(o);
  var p = pt(ev);
  var a0 = Math.atan2(p.y - o.y, p.x - o.x) * 180 / Math.PI;
  var r  = Math.sqrt((p.x - o.x) * (p.x - o.x) + (p.y - o.y) * (p.y - o.y)) / canvasScale;
  o.guide.setAttribute("r", r.toFixed(1));
  o.guide.setAttribute("display", "inline");
  drag = {kind:"rot", o:o, base:a0 - o.rot, id:ev.pointerId};
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
}
function startOvalDrag(ov, ev, mode){
  ev.preventDefault(); ev.stopPropagation();
  var p = pt(ev);
  ovalLayer.appendChild(ov.g);
  drag = {kind:"oval", ov:ov, mode:mode, dx:ov.cx - p.x, dy:ov.cy - p.y, id:ev.pointerId};
  try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
}
stage.addEventListener("pointerdown", function(){ hideInfo(true); });
stage.addEventListener("pointermove", function(ev){
  if (!drag || ev.pointerId !== drag.id) return;
  var p = pt(ev);
  if (drag.kind === "obj"){
    var o = drag.o;
    if (Math.abs(p.x - drag.sx) > 5 || Math.abs(p.y - drag.sy) > 5) drag.moved = true;
    o.x = clamp(p.x + drag.dx, 20, W - 20);
    o.y = clamp(p.y + drag.dy, 20, H - 20);
    place(o);
  } else if (drag.kind === "rot"){
    var ro = drag.o;
    var ang = Math.atan2(p.y - ro.y, p.x - ro.x) * 180 / Math.PI - drag.base;
    if (ev.shiftKey) ang = Math.round(ang / 15) * 15;   /* hold Shift to step by 15° */
    ro.rot = ang;
    place(ro);
  } else {
    var ov = drag.ov;
    if (drag.mode === "move"){ ov.cx = p.x + drag.dx; ov.cy = p.y + drag.dy; }
    if (drag.mode === "x"  || drag.mode === "xy") ov.rx = Math.abs(p.x - ov.cx);
    if (drag.mode === "y"  || drag.mode === "xy") ov.ry = Math.abs(p.y - ov.cy);
    drawOval(ov);
  }
});
function endDrag(ev){
  if (!drag || ev.pointerId !== drag.id) return;
  if (drag.kind === "rot") drag.o.guide.setAttribute("display", "none");
  if (drag.kind === "obj"){
    var o = drag.o;
    if (o.y > trayTop){
      o.inTray = true; resetPiece(o);
      o.x = o.home.x; o.y = o.home.y;
      place(o); setActive(null);
    }
    if (!drag.moved && CHAR_INFO[lbl(o.spec.label)]){ infoStuck = true; showInfo(o); }
    showEmptyHint();
  }
  drag = null;
  try { stage.releasePointerCapture(ev.pointerId); } catch (e) {}
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

/* ---------- controls ---------- */
function applyLang(){
  document.documentElement.lang = LANGS[LANGI];
  document.getElementById("ttl").textContent   = t("title");
  document.getElementById("addOval").textContent = t("group");
  document.getElementById("again").textContent = t("again");
  ["turnL","turnR","flipH","flipV"].forEach(function(id){
    document.getElementById(id).setAttribute("title", t(id));
  });
  var sb = document.getElementById("sets").children;
  for (var i = 0; i < sb.length; i++)
    sb[i].textContent = t(sb[i].getAttribute("data-key"));
  boardPrompt.textContent = t("prompt");
  trayHint.textContent = (setKey === "chars") ? t("charsHint") : t("trayHint");
  objs.forEach(function(o){
    if (o.labelNode) o.labelNode.textContent = lbl(o.spec.label);
    if (o.dateNode)  o.dateNode.textContent  = lbl(o.spec.dates);
    if (o.glyphNode) o.glyphNode.textContent = lbl(o.spec.label);
  });
  ovals.forEach(function(ov){ if (!ov.named){ ov.label = t("groupName"); drawOval(ov); } });
  showEmptyHint();
}
function setLang(i){
  LANGI = i;
  var lb = document.getElementById("langs").children;
  for (var j = 0; j < lb.length; j++) lb[j].className = (j === i) ? "on" : "";
  applyLang();
}

var langBar = document.getElementById("langs");
["EN", "ES", "中文"].forEach(function(name, i){
  var b = document.createElement("button");
  b.textContent = name;
  b.onclick = function(){ setLang(i); };
  langBar.appendChild(b);
});

var setsBar = document.getElementById("sets");
SETS.forEach(function(s){
  var b = document.createElement("button");
  b.textContent = s.name;
  b.setAttribute("data-key", s.key);
  b.onclick = function(){ buildSet(s.key); };
  setsBar.appendChild(b);
});
document.getElementById("turnL").onclick = function(){ turnActive(-15); };
document.getElementById("turnR").onclick = function(){ turnActive(15); };
document.getElementById("flipH").onclick = function(){ flipActive("h"); };
document.getElementById("flipV").onclick = function(){ flipActive("v"); };
document.addEventListener("keydown", function(e){
  if (e.target && e.target.id === "labelEdit") return;
  var k = e.key;
  if (k === "[") turnActive(-15);
  else if (k === "]") turnActive(15);
  else if (k === "h" || k === "H") flipActive("h");
  else if (k === "v" || k === "V") flipActive("v");
  else return;
  e.preventDefault();
});
document.getElementById("addOval").onclick = addOval;
document.getElementById("again").onclick = function(){
  clearOvals();
  objs.forEach(function(o){ o.inTray = true; resetPiece(o); });
  setActive(null);
  layout();
};

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(layout, 80);
});

buildSet("triangles");
setLang(0);
</script>
</body>
</html>
